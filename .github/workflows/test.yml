name: Verify MKP
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the MKP
        run: python3 build_mkp.py
      - name: Run offline unit/integration tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate release checksum
        run: cd dist && sha256sum -c SHA256SUMS
